[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.6's TestClient prefers `httpx2`; we stay on `httpx` (which
    # FastAPI still depends on) during the migration. Drop this when FastAPI
    # moves to httpx2.
    "ignore:Using .httpx. with .starlette.testclient.:starlette.exceptions.StarletteDeprecationWarning",
]
